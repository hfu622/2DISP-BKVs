[package]
name = "packing-bkv-reproductions"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
[workspace]
[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.20"
jagua-rs = { path = "../vendor/jagua-rs/jagua-rs", features = ["spp"] }
geo = { version = "0.33", default-features = false, features = ["earcutr"] }
[profile.release]
opt-level = 2
debug = 0
strip = "symbols"
lto = false
codegen-units = 8
incremental = false
[profile.test]
opt-level = 2
debug = 0
incremental = false
